[package]
name = "headroom"
version = "0.1.0"
edition = "2024"
description = "Reads SteelSeries Arctis Nova Pro Wireless, Nova Elite and Nova 7X battery levels, from a window or a hotkey, without SteelSeries GG"
license = "MIT"
authors = ["Quin Gillespie"]
repository = "https://github.com/accessware/headroom"
readme = "README.md"
include = ["src/**", "build.rs", "headroom.iss.in", "CHANGELOG.md", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "findings.md", "rustfmt.toml", "clippy.toml"]

[dependencies]
anyhow = "1.0.104"
doorbell = "0.1.2"
homeport = "0.1.0"
key-chord = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
ship-shape = "0.6.1"
toml = "1.2.2"
wx-utils = { version = "0.5.3", features = ["global-hotkeys", "shortcuts", "tray"] }
wxdragon = { version = "0.9.25", default-features = false }

[target.'cfg(windows)'.dependencies]
prismer = { version = "0.1.7", features = ["static"] }
windows-sys = { version = "0.61.2", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_HumanInterfaceDevice", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }

[build-dependencies]
shipfitter = { version = "0.2.5", default-features = false, features = ["windows-resources"] }

[workspace]
members = ["xtask"]

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
absolute_paths = "warn"

[lints]
workspace = true

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
